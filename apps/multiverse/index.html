const SITES = [
  { key: "dendera", x: -530 },
  { key: "didyma", x: -430 },
  { key: "milan", x: -320 },
  { key: "notredame", x: -215 },
  { key: "house", x: -180 },
  { key: "cologne", x: -125 },
  { key: "bighouse", x: -65 },
  { key: "hephaestus", x: -45 },
  { key: "parthenon", x: 0 },
  { key: "colosseum", x: 130 },
  { key: "windmill", x: 268 },
  { key: "versailles", x: 480 },
  { key: "caerphilly", x: 760 },

// metres of the eye -- the plane spans the world, so the frustum alone would never cull it.

//   1     (default) as ever -- and it means EVERYTHING that stirs: the animals and the people, the butterflies,
//         dragonflies, fish and squirrels, the carts, barge and boat gliding between sim ticks, the dock's
//         freight, the mill sails and the water wheels. NOTE that the last three stop inside the SIMULATION,
//         so a stopped world is not the world a peer sees: these switches are for measuring, not for playing.
//   still drawn, but posed ONCE and never again -- they stand like statues. Takes the skeleton walks off the CPU
//         (a transform chain per part per figure per frame) while their quads still fill the screen: the GPU half
//         alone. (Their view-space sync still runs each frame, so a little CPU remains.)
//   0     neither posed nor drawn: both halves gone at once

// isolates the cost of showing them, not of thinking about them. (?freeze=0 stops the world itself instead.)
const FIGURES = qp.get("figures") ?? "1";
let stirred = 0;
// true while anything alive should still be moved. Everything is placed and posed on the FIRST frame whatever
// the switch says -- otherwise carts would sit at the origin and figures in their rest pose -- and after that
// only ?figures=1 keeps stirring.
const stir = () => FIGURES === "1" || stirred < 2;
const renderer = new THREE.WebGLRenderer({ antialias: AA });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, num("dpr", CONFIG.renderer.maxPixelRatio)));   // ?dpr=1: the other big framebuffer lever
TEXTURES.on = qp.has("textures") ? qp.get("textures") !== "0" : CONFIG.textures.bakedTiles;
Object.assign(PARALLAX, { on: qp.has("parallax") ? qp.get("parallax") !== "0" : CONFIG.textures.parallax ?? true,   // ?parallax=0|1: the architecture's relief
                          steps: CONFIG.textures.parallaxSteps ?? 8, far: CONFIG.textures.parallaxFar ?? 15, shadowSteps: CONFIG.textures.parallaxShadowSteps ?? 4 });   // ?textures=0: patterns evaluated per pixel instead of read from baked mipmapped tiles

const gap = 5.5;   // elephants are ~4.3m long; keep neighbors clear
const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
const rows = Math.max(1, Math.ceil(n / Math.max(1, cols)));
const extent = Math.max(13, cols * gap * .75);               // herd footprint; camera spawns off its edge
const frontZ = -(rows * gap + 22);                           // building facades line up here, facing the herd
const townDepth = Math.max(0, ...town.map((s) => BUILDINGS[s.key].footprint[1]));
const townReach = Math.max(0, ...town.map((s) => Math.abs(s.x) + BUILDINGS[s.key].footprint[0] / 2));
const baseR = town.length ? Math.max(extent, -frontZ + townDepth + 12, townReach + 30) : extent;   // +30: the highway's turning loops sit past the last building
const nTreesReq = qp.has("trees") ? Math.max(0, num("trees", 0)) : null;   // ?trees=0 disables
const groundR = Math.max(baseR, nTreesReq !== 0 ? extent + 285 : 0);       // room for the woods, the (large) lake, and the farm village on the river's south bank
const nTrees = nTreesReq ?? Math.min(240, Math.max(40, Math.round(groundR * groundR / 2200)));

// a building site's center z: facade-row sites line up on frontZ; the odd
// one out (the water mill on the river bank) carries its own z
const siteZ = (s) => s.z ?? frontZ - BUILDINGS[s.key].footprint[1] / 2;
// the ground a site actually occupies, grown by a margin: its footprint, or
// for a hollow site (the town wall, the palisade) only the bands it lists
const siteRects = (s, m) => {
  const d = BUILDINGS[s.key];
  if (d.blocks) return d.blocks.map((b) => ({ x0: s.x + b.x0 - m, x1: s.x + b.x1 + m, z0: s.z + b.z0 - m, z1: s.z + b.z1 + m }));
  const f = d.footprint, z = siteZ(s);
  return [{ x0: s.x - f[0] / 2 - m, x1: s.x + f[0] / 2 + m, z0: z - f[1] / 2 - m, z1: z + f[1] / 2 + m }];
};
const inSites = (x, z, m) => sites.some((s) => siteRects(s, m).some((r) => x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1));
// rolling terrain: layered sines, blended flat under every building and the meadow
const flatZones = town.map((s) => ({ x: s.x, z: siteZ(s),
  hx: BUILDINGS[s.key].footprint[0] / 2 + 3, hz: BUILDINGS[s.key].footprint[1] / 2 + 3 }));
flatZones.push({ x: 0, z: -(rows - 1) * gap / 2, hx: extent + 6, hz: (rows - 1) * gap / 2 + 12 });   // the herd's meadow
// the lake: a deep bowl carved south of the meadow, filled to WLEVEL
// the lake is a big C: a water tube of half-width `w` wrapped around a
// circular arc of radius `rc`, its opening (`gap` radians wide) facing
// north toward the meadow -- the path walks through the gap into the
// lagoon's grassy heart
const LAKE = { x: 18, z: extent + 120, rc: 70, w: 40, gap: 1.7 };
LAKE.g0 = -Math.PI / 2 + LAKE.gap / 2;
LAKE.g1 = -Math.PI / 2 - LAKE.gap / 2 + Math.PI * 2;
LAKE.e0 = [LAKE.x + Math.cos(LAKE.g0) * LAKE.rc, LAKE.z + Math.sin(LAKE.g0) * LAKE.rc];
LAKE.e1 = [LAKE.x + Math.cos(LAKE.g1) * LAKE.rc, LAKE.z + Math.sin(LAKE.g1) * LAKE.rc];
const WLEVEL = -2.2;
// signed distance to the shoreline: negative = in the water zone
const lakeSD = (x, z) => {
  const dx = x - LAKE.x, dz = z - LAKE.z;
  let t2 = Math.atan2(dz, dx);
  while (t2 < LAKE.g0) t2 += Math.PI * 2;
  const dArc = t2 <= LAKE.g1
    ? Math.abs(Math.hypot(dx, dz) - LAKE.rc)
    : Math.min(Math.hypot(x - LAKE.e0[0], z - LAKE.e0[1]), Math.hypot(x - LAKE.e1[0], z - LAKE.e1[1]));
  return dArc - LAKE.w;

const hasLake = groundR >= LAKE.z + LAKE.rc + LAKE.w + 2;
// flatten the surroundings to 0 first, so the carved bowl reliably dips

if (hasLake) flatZones.push({ x: LAKE.x, z: LAKE.z, hx: LAKE.rc + LAKE.w + 5, hz: LAKE.rc + LAKE.w + 5 });
// the river: a meandering groove from the west edge into the lake's west
// arm, 16m bank to bank, carved 4.4m below the plain so the shared water

const hasRiver = hasLake;
const RIVER = { z: LAKE.z, amp: 12, k: .03, ph: 1.0, hw: 8, bank: 3.5, depth: 4.4, xEnd: LAKE.x - LAKE.rc - LAKE.w + 12, flow: 1.6 };

const BASIN = { x: -185, len: 40, add: 10 };

const MILL = hasRiver ? { key: "watermill", x: -125 } : null;
let VILLAGE_X = null, vStreet = null, wallX = null;   // the bridge's x, the village street line and the town wall's x-extent, once the river is laid out

  }

    shoot.vel.set(-Math.sin(a), -.35 - Math.random() * .3, Math.cos(a)).normalize().multiplyScalar(groundR * .9);

  if (cartHerd) cartHerd.update(ta);
  for (const h of hands) {   // the loaded rig stands in for the free one while a piece is in the arms, and the piece rides them
    if (h.anC.down) { h.an.hidden = true; h.anC.hidden = false; continue; }   // struck down (combat.js): the one that fell stays, where it fell
    if (h.an.down) { h.an.hidden = false; h.anC.hidden = true; continue; }
    const p = h.an.position, c = Math.cos(h.an.rotY), s = Math.sin(h.an.rotY);
    if (h.item) {
      h.anC.position.copy(p); h.anC.rotY = h.an.rotY; h.anC.animT = h.an.animT; h.anC.amp = h.an.amp;
      h.an.hidden = true; h.anC.hidden = false;
      placeCarried(h.item, p.x + c * .42, p.y + .78, p.z - s * .42, h.an.rotY);
    } else { h.an.hidden = false; h.anC.hidden = true; }
  }
  for (const hh of handHerds) hh.update(ta);
  if (carrying) {   // and in yours
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    placeCarried(carrying, camera.position.x + fx * .8, camera.position.y - .75, camera.position.z + fz * .8, yaw);
  }
  for (const gs of Object.values(goodsSets)) gs.commit();   // upload the goods' matrices
  for (const ah of arenaHerds) ah.update(ta);
  for (const dr of doors) {   // doors swing smoothly toward their state
    const target = dr.open ? 1.9 : 0;
    if (Math.abs(target - dr.ang) > .001) {
      dr.ang += (target - dr.ang) * Math.min(1, dt * 5);
      dr.grp.rotation.y = dr.base + dr.ang;
      if (dr.win) placePane(dr);
    }
  }
  if (camMode === "fps") {   // bottom-center hint for the one available action
    const it = findInteraction();
    hintEl.style.display = it ? "block" : "none";
    if (it) hintEl.textContent = it.label;
  }
  netTick(t);
  updateSelf();
  combat.update(dt);
  archery.update(dt);
  sword.update(dt);
  if (freeze === null) cloudHerd.update(0);   // drift happens in the sim ticks
  if (stir()) for (const hb of windmillHubs) hb.rotation.z = ta * .45;   // sails turn with the world clock
  if (stir()) for (const ww of waterWheels) ww.grp.rotation.z = -ta * ww.omega;   // the current turns the mill wheel (undershot: bottom runs with the flow)
  audioTick(t + clockOff);
  if (waterMat) {
    waterMat.uniforms.uT.value = t;
    waterMat.uniforms.uEye.value.copy(camera.position);
    if (reflector) {
      // the water plane spans the world, so the frustum never culls it: gate the extra draw on there being
      // water within reach of the eye. Invisible means no onBeforeRender, which means no reflection pass at all.
      const near = waterSD(camera.position.x, camera.position.z) < REFLECT.reach;
      reflector.visible = near;
      waterMat.uniforms.uReflOn.value = near ? (REFLECT.mode === "raw" ? 3 : REFLECT.mode === "uv" ? 2 : 1) : 0;
    }
  }
  FOLIAGE_T.value = t;   // the leaves' wind
  jetMat.uniforms.uT.value = t; poolMat.uniforms.uT.value = t;
  fireMat.uniforms.uT.value = t;   // flames flicker on the render clock
  if (night && freeze === null) updateShooting(dt);
  else shootMesh.visible = false;
  rainbow.visible = weather === 1 && wxInt === 0 && !night;   // rain AND sun: only light rain lets it through, and never at night
  precip.update(camera, t, weather, wxInt, roofedAt);   // rain / snow curtains, hidden under roofs
  if (++paintingsIn === 3) paintingSet.capture(renderer, paintingViews, { before: () => { beginSecondaryView(); mirrorSet.hide(); }, after: endSecondaryView });   // the paintings: taken once
  mirrorSet.update(camera);   // which mirrors reflect this frame
  LOD.noCull = mirrorSet.active() > 0 || paintingsIn < 4;   // (composite off-view culling: not while a mirror or the paintings look elsewhere)
  grassFringe.update(renderer, scene, camera, t, WLEVEL);   // the ground's mask, for the stalks that stand over what is in front of them
  mark("rest");
  renderOcclusion(renderer, scene, camera);   // stage 3b: the occluders' depth alone, so hidden figures are never shaded
  renderNearPass(renderer, camera);   // the 3D LOD pre-pass: near animals raymarched at reduced resolution
  renderer.render(scene, camera);
  renderer.autoClear = false;
  if (camera.position.y < WLEVEL - .02 && groundH(camera.position.x, camera.position.z) < WLEVEL - .3) {
    uwMat.uniforms.uT.value = t;
    renderer.render(uwScene, nightCam);
  }
  if (night) renderer.render(nightScene, nightCam);
  renderer.autoClear = true;
  mark("draw submit");
  gpuEnd();
  frames++;
  const now = performance.now();
  cpuSum += now - tick0;
  if (now - lastStat > 1000) {   // once a second: fps, and the frame's cost against the budget -- green under .6 of it, yellow under 1.5, red above
    const cpu = cpuSum / frames, gpu = gpuN ? gpuSum / gpuN : null, cost = cpu + (gpu ?? 0);
    const budget = FRAME.target > 0 ? 1000 / FRAME.target : 0;                      // ms a frame may take to hold that rate
    const col = !budget || cost < .6 * budget ? "#1c8a2e" : cost < 1.5 * budget ? "#b08900" : "#c0271d";
    const spare = budget ? ` · <b style="color:${col}">${(100 * cost / budget).toFixed(0)}% of ${budget.toFixed(1)}ms at ${FRAME.target}fps</b>` : "";
    stats = `· ${(frames * 1000 / (now - lastStat)).toFixed(0)} fps${FRAME.uncapped ? " (uncapped)" : ""} · <b style="color:${col}">${cost.toFixed(1)} ms/frame</b>` +
      ` (cpu ${cpu.toFixed(1)}${gpu !== null ? ` + gpu ${gpu.toFixed(1)}` : ", gpu not measurable here"})${spare} · ` +
      `${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} tris · ` +
      // what is actually being rendered into: the drawing buffer, the ratio it came from, and whether it is multisampled
      `${renderer.domElement.width}x${renderer.domElement.height} dpr ${renderer.getPixelRatio()} aa ${AA ? "on" : "off"}` +
      (FIGURES === "1" ? "" : FIGURES === "0" ? " · <b>no figures</b>" : " · <b>figures still</b>");
    frames = 0; lastStat = now; cpuSum = gpuSum = gpuN = 0;
    updateLabel();
  }
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__scene = scene; window.__THREE = THREE; window.__camera = camera;   // debug hooks for the headless harness
window.__simStep = () => simTicks(simTick + 1);
window.__dbg = { combat, combatNames, sword, setWeapon, archery, tableware, guards, mountables, keys, findInteraction, herd, talkers, callers, doors, carts, collides, colliderSites, goods, hands, get barge() { return bargeSt; }, get boat() { return boatSt; }, sites, groundH, bargePose, yards, callNow: () => { for (const c of callers) c.next = 0; }, speech: () => ({ spoken, langMode, toneMode, wordMode, moodMode }),
  talkNow: () => { for (const t of talkers) t.next = 0; },
  look: (x, z) => { yaw = Math.atan2(-(x - camera.position.x), -(z - camera.position.z)); },
  pitch: (p) => { if (p !== undefined) pitch = p; return pitch; },
  PIPE, setPipe, FRAME, setFps, FRINGE, profile,   // profile(): where the frame's CPU time goes, printed after a second   // setFps(90) changes the budget the readout judges against; setFps("max") uncaps the loop

  wanderers, pathRoutes, waterSD, dryKeep, putDown, WLEVEL, riders,   // (checks: swimmers' depth, dry tracks, goods riding the barge)
  tracks, tracksDraw, renderer,   // the between-ticks drawing (see simTicks)
  // A GPU bench, from the console: renders the CURRENT view n times back to back and waits for the GPU
  // (no swap between them, so the answer is GPU work per frame, not the 16.7ms vsync interval), with the
  // named herds' meshes left out. __dbg.bench() - __dbg.bench(30, ["life"]) is what drawing the villagers
  // costs from where you stand -- point it at a group behind a house, then at one in the open, and the two
  // differences are the wasted share and the useful one. Names: __dbg.combatNames().map(([n]) => n)
  bench: (n = 30, hide = []) => {
    const gl = renderer.getContext(), off = combatNames().filter(([nm]) => hide.includes(nm)).map(([, h]) => h.mesh).filter(Boolean);
    for (const m of off) m.visible = false;
    renderNearPass(renderer, camera); renderer.render(scene, camera); gl.finish();   // warm up: shaders, uploads, the first sync
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { renderNearPass(renderer, camera); renderer.render(scene, camera); }
    gl.finish();
    const ms = (performance.now() - t0) / n;
    for (const m of off) m.visible = true;
    return +ms.toFixed(2);
  },
  get squirrels() { return squirrels; }, mirrors: () => mirrorSet, paintings: () => ({ count: paintingSet.count, pictures: paintingSet.pictures.length, views: paintingViews, frames: paintingSet.frames }), get env() { return env; },
  placeAt: (x, y, z) => { camera.position.x = x; camera.position.z = z; standY = y; camera.position.y = y + eyeH; airborne = false; },   // (checks: stand on a given floor)
  get life() { return life; }, get lifeHerd() { return lifeHerd; },   // the villagers: census(), bell(hour), places
  // why is this spot "under a roof"? (the weather curtains hide there): floors overhead, roofed footprints
  whyRoofed: (x, z, y) => ({ floors: floorsAt(x, z).map((h, i) => [i, +h.toFixed(2)]).filter(([, h]) => h > y + .3),
    sites: sites.filter((s) => !roofless(s) && Math.abs(x - s.x) < BUILDINGS[s.key].footprint[0] / 2 && Math.abs(z - siteZ(s)) < BUILDINGS[s.key].footprint[1] / 2)
                .map((s) => [s.key, s.x, siteZ(s), BUILDINGS[s.key].footprint]) }),
  place: (x, z) => { camera.position.x = x; camera.position.z = z; standY = terrainY(x, z); airborne = false; },
  state: () => ({ mounted: mounted?.def.name ?? null, flying: !!mounted?.flying, standY, y: mounted?.w.p.y,
                  wingT: mounted?.wingT, animT: mounted?.animT }) };
// (after every herd exists: silencing them here catches the lot -- animals, villagers, guards, riders, the
// fisherman, the pairs under a yoke -- without a switch at each call site)
if (FIGURES !== "1") for (const [, h] of combatNames()) {
  if (FIGURES === "0") { h.update = () => {}; if (h.mesh) h.mesh.visible = false; }
  else { const u = h.update; let posed = false; h.update = (t) => { if (!posed) { posed = true; u.call(h, t); } }; }   // still: one pose, then nothing
}
window.__ready = true;
</script>
</body>
