<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SPECIES, makeButterfly, makeDragonfly, makeFish, makeShark, makeDolphin } from "./species.js";
import { buildSpecies as buildRig } from "./rig.js";
import { buildSpecies as buildBanner } from "./banner.js";
import { createHerd } from "./instanced.js";
import { animateSpecies } from "./anim.js";
import { BUILDINGS, buildBuilding, buildInstanced, waterWheel, woodMaterial, barge as bargeDef, barrel as barrelParts, sack as sackParts, SNOW, medievalHouse } from "./architecture.js";
import { VILLAGE, stoneBridge, stoneWall, palisade, fisherBoat, oar, fishingRod, fishingLine, caughtFish } from "./village.js";
// the farm village's buildings join the catalogue: bakery, yards, fields, orchard, and three farmhouses (the town house at farm sizes)
Object.assign(BUILDINGS, VILLAGE, {
  farmhouseA: medievalHouse({ name: "Farmhouse", plaster: 0xe3d9c3, roofC: 0x6f4a2c }),
  farmhouseB: medievalHouse({ name: "Farmhouse", width: 7, depth: 9, plaster: 0xd8cdb4, timber: 0x4e3a22, roofC: 0x8a5a35 }),
  farmhouseC: medievalHouse({ name: "Farmhouse", width: 6, depth: 8, plaster: 0xdcd2bd, roofC: 0x7a5030 }),
  // the village's cottages and houses (seven, so the village counts twenty roofs with its crafts and church)
  cottageA: medievalHouse({ name: "Cottage", width: 6, depth: 7.5, storeys: 1, floorH: 3.0, plaster: 0xe6dcc6, roofC: 0x6b4a30 }),
  cottageB: medievalHouse({ name: "House", width: 6.5, depth: 8.5, plaster: 0xd4c9ae, timber: 0x4a3620, roofC: 0x7d5433 }),
  cottageC: medievalHouse({ name: "Cottage", width: 5.5, depth: 7, storeys: 1, floorH: 2.9, plaster: 0xdfd3bc, roofC: 0x8a5a35 }),
  cottageD: medievalHouse({ name: "House", width: 7, depth: 9, plaster: 0xe0d6c0, timber: 0x5b4326, roofC: 0x6f4a2c }),
  cottageE: medievalHouse({ name: "Cottage", width: 6, depth: 8, storeys: 1, floorH: 3.0, plaster: 0xd9cfba, roofC: 0x75502e }),
  cottageF: medievalHouse({ name: "House", width: 6.5, depth: 8.5, plaster: 0xe3d9c3, timber: 0x4e3a22, roofC: 0x8a5a35 }),
  cottageG: medievalHouse({ name: "Cottage", width: 6.5, depth: 7.5, storeys: 1, floorH: 2.9, plaster: 0xd8cdb4, roofC: 0x6b4a30 }),
});
import { makeCart, wheelDef, FLEET, LOAD_VARIANTS, CART_SIZES } from "./carts.js";
import { makeTree, TREE_SPECIES, makeMushroom, MUSHROOMS, makeBush, makeCloud, makeFlower, FLOWERS, rng } from "./flora.js";
import { makePerson } from "./people.js";
import { HostSession, GuestSession } from "./rtc.js";
import { createSpeaker, LANGS, WORDS, MOODS } from "./speech.js";
import { animalCall, CALLS, makeSpace } from "./calls.js";

const qp = new URLSearchParams(location.search);
const num = (k, d) => qp.has(k) ? Number(qp.get(k)) : d;
const mode = ["rig", "banner"].includes(qp.get("mode")) ? qp.get("mode") : "instanced";   // one draw call for the whole herd by default
const pixelDepth = qp.get("depth") !== "flat";               // ?depth=flat for the early-z A/B
const bParam = qp.get("building");                           // ?building=none | parthenon | hephaestus,parthenon
const SITES = [
  { key: "dendera", x: -530 },
  { key: "didyma", x: -430 },
  { key: "milan", x: -320 },
  { key: "notredame", x: -215 },
  { key: "house", x: -180 },
  { key: "cologne", x: -125 },
  { key: "bighouse", x: -65 },
  { key: "hephaestus", x: -45 },
  { key: "parthenon", x: 0 },
  { key: "colosseum", x: 130 },
  { key: "windmill", x: 268 },
  { key: "versailles", x: 480 },
  { key: "caerphilly", x: 760 },
];
let town = bParam === "none" ? [] : bParam ? SITES.filter((s) => bParam.split(",").includes(s.key)) : SITES;
if (town.length === 1) town = [{ ...town[0], x: 0 }];
const CAST = qp.has("species")                               // ?species=giraffe,cow shows just those (?species=none: buildings only)
  ? SPECIES.filter((s) => qp.get("species").split(",").includes(s.name))
  : SPECIES;
const n = CAST.length ? Math.max(1, num("n", CAST.length)) : 0;   // ?n=1000 for the herd stress test
const build = mode === "rig" ? buildRig : (d) => buildBanner(d, { pixelDepth });

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const shadows = mode === "rig" && n <= 16;   // banners are flat-shaded cutouts; no shadow pass
renderer.shadowMap.enabled = shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const gap = 5.5;   // elephants are ~4.3m long; keep neighbors clear
const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
const rows = Math.max(1, Math.ceil(n / Math.max(1, cols)));
const extent = Math.max(13, cols * gap * .75);               // herd footprint; camera spawns off its edge
const frontZ = -(rows * gap + 22);                           // building facades line up here, facing the herd
const townDepth = Math.max(0, ...town.map((s) => BUILDINGS[s.key].footprint[1]));
const townReach = Math.max(0, ...town.map((s) => Math.abs(s.x) + BUILDINGS[s.key].footprint[0] / 2));
const baseR = town.length ? Math.max(extent, -frontZ + townDepth + 12, townReach + 30) : extent;   // +30: the highway's turning loops sit past the last building
const nTreesReq = qp.has("trees") ? Math.max(0, num("trees", 0)) : null;   // ?trees=0 disables
const groundR = Math.max(baseR, nTreesReq !== 0 ? extent + 285 : 0);       // room for the woods, the (large) lake, and the farm village on the river's south bank
const nTrees = nTreesReq ?? Math.min(240, Math.max(40, Math.round(groundR * groundR / 2200)));

// a building site's center z: facade-row sites line up on frontZ; the odd
// one out (the water mill on the river bank) carries its own z
const siteZ = (s) => s.z ?? frontZ - BUILDINGS[s.key].footprint[1] / 2;
// the ground a site actually occupies, grown by a margin: its footprint, or
// for a hollow site (the town wall, the palisade) only the bands it lists
const siteRects = (s, m) => {
  const d = BUILDINGS[s.key];
  if (d.blocks) return d.blocks.map((b) => ({ x0: s.x + b.x0 - m, x1: s.x + b.x1 + m, z0: s.z + b.z0 - m, z1: s.z + b.z1 + m }));
  const f = d.footprint, z = siteZ(s);
  return [{ x0: s.x - f[0] / 2 - m, x1: s.x + f[0] / 2 + m, z0: z - f[1] / 2 - m, z1: z + f[1] / 2 + m }];
};
const inSites = (x, z, m) => sites.some((s) => siteRects(s, m).some((r) => x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1));
// rolling terrain: layered sines, blended flat under every building and the meadow
const flatZones = town.map((s) => ({ x: s.x, z: siteZ(s),
  hx: BUILDINGS[s.key].footprint[0] / 2 + 3, hz: BUILDINGS[s.key].footprint[1] / 2 + 3 }));
flatZones.push({ x: 0, z: -(rows - 1) * gap / 2, hx: extent + 6, hz: (rows - 1) * gap / 2 + 12 });   // the herd's meadow
// the lake: a deep bowl carved south of the meadow, filled to WLEVEL
// the lake is a big C: a water tube of half-width `w` wrapped around a
// circular arc of radius `rc`, its opening (`gap` radians wide) facing
// north toward the meadow -- the path walks through the gap into the
// lagoon's grassy heart
const LAKE = { x: 18, z: extent + 120, rc: 70, w: 40, gap: 1.7 };
LAKE.g0 = -Math.PI / 2 + LAKE.gap / 2;
LAKE.g1 = -Math.PI / 2 - LAKE.gap / 2 + Math.PI * 2;
LAKE.e0 = [LAKE.x + Math.cos(LAKE.g0) * LAKE.rc, LAKE.z + Math.sin(LAKE.g0) * LAKE.rc];
LAKE.e1 = [LAKE.x + Math.cos(LAKE.g1) * LAKE.rc, LAKE.z + Math.sin(LAKE.g1) * LAKE.rc];
const WLEVEL = -2.2;
// signed distance to the shoreline: negative = in the water zone
const lakeSD = (x, z) => {
  const dx = x - LAKE.x, dz = z - LAKE.z;
  let t2 = Math.atan2(dz, dx);
  while (t2 < LAKE.g0) t2 += Math.PI * 2;
  const dArc = t2 <= LAKE.g1
    ? Math.abs(Math.hypot(dx, dz) - LAKE.rc)
    : Math.min(Math.hypot(x - LAKE.e0[0], z - LAKE.e0[1]), Math.hypot(x - LAKE.e1[0], z - LAKE.e1[1]));
  return dArc - LAKE.w;
};
const hasLake = groundR >= LAKE.z + LAKE.rc + LAKE.w + 2;
// flatten the surroundings to 0 first, so the carved bowl reliably dips
// below water level no matter what hill the sines put there
if (hasLake) flatZones.push({ x: LAKE.x, z: LAKE.z, hx: LAKE.rc + LAKE.w + 5, hz: LAKE.rc + LAKE.w + 5 });
// the river: a meandering groove from the west edge into the lake's west
// arm, 16m bank to bank, carved 4.4m below the plain so the shared water
// level leaves ~2m of water; it flows east (+x). The mill stands on the
// north bank ~40m before the lake, its wheel out in the stream.
const hasRiver = hasLake;
const RIVER = { z: LAKE.z, amp: 12, k: .03, ph: 1.0, hw: 8, bank: 3.5, depth: 4.4, xEnd: LAKE.x - LAKE.rc - LAKE.w + 12, flow: 1.6 };
const riverZ = (x) => RIVER.z + RIVER.amp * Math.sin(x * RIVER.k + RIVER.ph);
// the basin: the river widens smoothly to ~36m around the landing, 60m
// west of the mill (well clear of the lake)
const BASIN = { x: -185, len: 40, add: 10 };
const riverHW = (x) => RIVER.hw + BASIN.add * Math.exp(-(((x - BASIN.x) / BASIN.len) ** 2));
const riverSD = (x, z) => !hasRiver || x > RIVER.xEnd ? 1e9 : Math.abs(z - riverZ(x)) - riverHW(x);   // signed distance to the bank line
// the riverside street: a 1.5m track 4m up the north bank, buildings set
// back 2m behind it with their doors on the street. The mill stands at the
// street's west end right on the bank (its wheel needs the water); every
// later riverside building is one more entry here, placed by x alone.
const QUAY = 4;   // track center, meters north of the bank line
const quayZ = (x) => riverZ(x) - riverHW(x) - QUAY;
const MILL = hasRiver ? { key: "watermill", x: -125 } : null;
let VILLAGE_X = null, vStreet = null, wallX = null;   // the bridge's x, the village street line and the town wall's x-extent, once the river is laid out
const RIVERSIDE = [];
if (MILL) {
  const fp = BUILDINGS.watermill.footprint;
  MILL.z = riverZ(MILL.x) - riverHW(MILL.x) - 1 - fp[1] / 2;   // south footprint edge 1m short of the bank line
  RIVERSIDE.push(MILL);
  const lfp = BUILDINGS.landing.footprint;   // the landing at the basin: its deck reaches out over the bank
  RIVERSIDE.push({ key: "landing", x: BASIN.x, z: riverZ(BASIN.x) - riverHW(BASIN.x) - 1 - lfp[1] / 2 });
  for (const [key, x] of [["tavern", MILL.x + 30], ["smithy", BASIN.x - 18], ["pottery", BASIN.x + 20]]) {   // door facing +z onto the street; the crafts flank the landing
    const fpb = BUILDINGS[key].footprint;
    RIVERSIDE.push({ key, x, z: quayZ(x) - 2.5 - fpb[1] / 2 });
  }
  // ---- the farm village on the SOUTH bank, west of the basin (village.js) ----
  // Houses back onto the river (1m off the bank line) with their doors on a
  // street 14m behind the bank; the yards and fields lie beyond the street
  // in two rows, the orchard at the east end. The bridge lands among the
  // houses, 35m west of the basin, so the barge passes under it coming and going.
  VILLAGE_X = BASIN.x - 35;
  BUILDINGS.bridge = stoneBridge({ hw: riverHW(VILLAGE_X), water: WLEVEL - .01 });
  const bankS = (x) => riverZ(x) + riverHW(x);   // the south bank line
  vStreet = (x) => bankS(x) + 15;                // the village street's center line (its north edge meets the ramp foot)
  // the riverside row: farms and crafts west of the market, then the cottages of the east end beyond it
  for (const [key, x] of [["cottageA", VILLAGE_X - 25.5], ["farmhouseA", VILLAGE_X - 14], ["bakery", VILLAGE_X + 12], ["farmhouseB", VILLAGE_X + 26], ["farmhouseC", VILLAGE_X + 40], ["fisherHut", VILLAGE_X + 53], ["cottageB", VILLAGE_X + 66], ["market", VILLAGE_X + 84],
                          ["cottageC", VILLAGE_X + 98], ["cottageD", VILLAGE_X + 110], ["cottageE", VILLAGE_X + 122], ["cottageF", VILLAGE_X + 134], ["cottageG", VILLAGE_X + 146]]) {
    const fp = BUILDINGS[key].footprint;
    RIVERSIDE.push({ key, x, z: bankS(x) + 1 + fp[1] / 2, bank: "south" });
  }
  RIVERSIDE.push({ key: "bridge", x: VILLAGE_X, z: riverZ(VILLAGE_X), bank: "river" });
  // a plot sits 2.5m behind the street's FURTHEST point over its own span (the
  // street follows the bank's curve), and the two yards flank the bridge road
  const footS = riverZ(VILLAGE_X) + BUILDINGS.bridge.halfL + BUILDINGS.bridge.ramp;   // where the south ramp meets the ground
  const plotZ = (x, fp, back = 0) => Math.max(vStreet(x - fp[0] / 2), vStreet(x), vStreet(x + fp[0] / 2), footS + .5) + 2.5 + back + fp[1] / 2;
  for (const [key, x] of [["pigYard", VILLAGE_X - 14], ["henYard", VILLAGE_X + 12.5], ["ryeField", VILLAGE_X + 27.5], ["barleyField", VILLAGE_X + 43], ["orchard", VILLAGE_X + 60], ["church", VILLAGE_X + 84],
                          ["weaver", VILLAGE_X + 100], ["tailor", VILLAGE_X + 111], ["fountain", VILLAGE_X + 123]]) {   // the church faces the market across the street; the crafts and the fountain square face the east-end cottages
    const fp = BUILDINGS[key].footprint;
    RIVERSIDE.push({ key, x, z: plotZ(x, fp), bank: "south", farm: true });
  }
  for (const [key, x] of [["cabbageField", VILLAGE_X - 12], ["beanField", VILLAGE_X + 2], ["garlicField", VILLAGE_X + 14], ["berries", VILLAGE_X + 27], ["stableYard", VILLAGE_X + 46]]) {
    const fp = BUILDINGS[key].footprint;
    RIVERSIDE.push({ key, x, z: plotZ(x, fp, 17 + 2.5), bank: "south", farm: true });   // the back row, behind the 17m-deep yards
  }
  // ---- the two enclosures (village.js), open to the river: a stone wall with a walkway round the south
  // village, a timber palisade round the north hamlet; the streets pass through their gatehouses ----
  {
    const south = RIVERSIDE.filter((s) => s.bank === "south"), north = RIVERSIDE.filter((s) => !s.bank);
    const WX0 = VILLAGE_X - 32, WX1 = VILLAGE_X + 158;
    const WZS = Math.max(...south.map((s) => s.z + BUILDINGS[s.key].footprint[1] / 2)) + 6;
    BUILDINGS.townWall = stoneWall({ x0: WX0, x1: WX1, zS: WZS, zN0: bankS(WX0) + 1, zN1: bankS(WX1) + 1,
                                     gates: [{ side: "w", at: vStreet(WX0) }, { side: "e", at: vStreet(WX1) }] });
    RIVERSIDE.push({ key: "townWall", x: 0, z: 0, bank: "wall" });   // world coordinates: the site is the origin
    wallX = [WX0, WX1];
    const PX0 = VILLAGE_X - 12, PX1 = Math.max(...north.map((s) => s.x + BUILDINGS[s.key].footprint[0] / 2)) + 3;
    const PZN = Math.min(...north.map((s) => s.z - BUILDINGS[s.key].footprint[1] / 2)) - 5;
    BUILDINGS.palisade = palisade({ x0: PX0, x1: PX1, zN: PZN, zS0: riverZ(PX0) - riverHW(PX0) - .5, zS1: riverZ(PX1) - riverHW(PX1) - .5,
                                    gates: [{ side: "n", at: BASIN.x }, { side: "e", at: quayZ(PX1) }] });   // the freight road and the quay street
    RIVERSIDE.push({ key: "palisade", x: 0, z: 0, bank: "wall" });
  }
  for (const s of RIVERSIDE) {
    const blocks = BUILDINGS[s.key].blocks;
    if (blocks) {   // the enclosures: level ground along the wall bands only, the village inside keeps its own zones
      for (const b of blocks) flatZones.push({ x: s.x + (b.x0 + b.x1) / 2, z: s.z + (b.z0 + b.z1) / 2, hx: (b.x1 - b.x0) / 2, hz: (b.z1 - b.z0) / 2 });
      continue;
    }
    const f = BUILDINGS[s.key].footprint;
    // `level`: the carve (river bank) is suppressed under the building too, so no corner hangs over a
    // falling bank -- except for what is deliberately built out over the water (jetty, landing, mill wheel)
    flatZones.push({ x: s.x, z: s.z, hx: f[0] / 2 + 3, hz: f[1] / 2 + 3, level: !["landing", "watermill", "fisherHut", "bridge"].includes(s.key) });
  }
}
const sites = [...town, ...RIVERSIDE];   // every building: the facade row plus the riverside
// castle moats: rectangular water rings carved around their islands
const moats = town.filter((s) => BUILDINGS[s.key].moat).map((s) => ({
  cx: s.x, cz: siteZ(s), ...BUILDINGS[s.key].moat }));
const groundH = (x, z) => {
  const base = Math.sin(x * .021 + 1.7) * Math.cos(z * .017 - .8) * 2.1
             + Math.sin(x * .043 - 2.1) * Math.sin(z * .038 + 1.3) * 1.0
             + Math.sin(x * .009 + z * .011) * 1.7;
  let k = 1, kc = 1;
  for (const zn of flatZones) {
    const dx = Math.max(0, Math.abs(x - zn.x) - zn.hx), dz = Math.max(0, Math.abs(z - zn.z) - zn.hz);
    const t = Math.min(1, Math.hypot(dx, dz) / 20);
    k = Math.min(k, t * t * (3 - 2 * t));
    if (zn.level) {   // a building's plot: level right out to 1m past the footprint, the bank carve fading back in over 2.5m
      const ex = Math.max(0, Math.abs(x - zn.x) - (zn.hx - 2)), ez = Math.max(0, Math.abs(z - zn.z) - (zn.hz - 2));
      const u = Math.min(1, Math.hypot(ex, ez) / 2.5);
      kc = Math.min(kc, u * u * (3 - 2 * u));
    }
  }
  let y = base * k;
  // ONE shared water level for the whole world: the plain is kept softly
  // above it (a smooth floor at -1.4m, .8m clear of the water), so only
  // what is deliberately carved -- lake, river, moats -- fills with water
  y = -1.4 + Math.log1p(Math.exp(4 * (y + 1.4))) / 4;
  let carve = 0;
  if (hasLake) {
    const sd = lakeSD(x, z);
    if (sd < 0) { const s = Math.min(1, -sd / LAKE.w); carve = 5.5 * s * s * (3 - 2 * s); }
  }
  if (hasRiver) {
    const sd = riverSD(x, z);
    if (sd < 0) {
      const s = Math.min(1, -sd / RIVER.bank), e = Math.min(1, (RIVER.xEnd - x) / 25);   // banks; fades into the lake bowl
      carve = Math.max(carve, RIVER.depth * s * s * (3 - 2 * s) * e * e * (3 - 2 * e));
    }
  }
  y -= carve * kc;
  for (const m of moats) {
    const dr = Math.max(Math.abs(x - m.cx) - m.hw, Math.abs(z - m.cz) - m.hd);
    if (dr > 0 && dr < m.w) y -= m.depth * Math.min(1, dr / 2.5, (m.w - dr) / 2.5);
  }
  return y;
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0e8);
scene.fog = new THREE.Fog(0xcfe0e8, groundR * 1.05, groundR * 2.4);   // past everything on the lawn

// near .3 (not .1) buys 3x depth-buffer precision at distance -- big facades
// like the Colosseum shimmer when mm-scale offsets drop below depth resolution
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .3, groundR * 6);

const camMode = qp.get("cam") === "orbit" ? "orbit" : "fps";   // default: a person's point of view
const defTz = n > 4 ? -(rows - 1) * gap / 2 : (n ? 0 : frontZ - 12);

    if (Math.abs(target - dr.ang) > .001) {
      dr.ang += (target - dr.ang) * Math.min(1, dt * 5);
      dr.grp.rotation.y = dr.base + dr.ang;
      if (dr.win) placePane(dr);
    }
  }
  if (camMode === "fps") {   // bottom-center hint for the one available action
    const it = findInteraction();
    hintEl.style.display = it ? "block" : "none";
    if (it) hintEl.textContent = it.label;
  }
  netTick(t);
  if (freeze === null) cloudHerd.update(0);   // drift happens in the sim ticks
  for (const hb of windmillHubs) hb.rotation.z = ta * .45;   // sails turn with the world clock
  for (const ww of waterWheels) ww.grp.rotation.z = -ta * ww.omega;   // the current turns the mill wheel (undershot: bottom runs with the flow)
  audioTick(t + clockOff);
  if (waterMat) waterMat.uniforms.uT.value = t;
  jetMat.uniforms.uT.value = t; poolMat.uniforms.uT.value = t;
  fireMat.uniforms.uT.value = t;   // flames flicker on the render clock
  if (night && freeze === null) updateShooting(dt);
  else shootMesh.visible = false;
  rainbow.visible = weather === 1 && wxInt === 0 && !night;   // rain AND sun: only light rain lets it through, and never at night
  wxGroup.visible = weather > 0;
  if (weather) {
    wxGroup.position.copy(camera.position);
    wxGroup.quaternion.copy(camera.quaternion);
    camera.getWorldDirection(_wxDir);
    for (const { d, m } of wxLayers) {
      m.visible = !roofedAt(camera.position.x + _wxDir.x * d,
                            camera.position.z + _wxDir.z * d,
                            camera.position.y + _wxDir.y * d);
      m.material.uniforms.uT.value = t;
      m.material.uniforms.uMode.value = weather;
      m.material.uniforms.uInt.value = wxInt;
    }
  }
  renderer.render(scene, camera);
  renderer.autoClear = false;
  if (camera.position.y < WLEVEL - .02 && groundH(camera.position.x, camera.position.z) < WLEVEL - .3) {
    uwMat.uniforms.uT.value = t;
    renderer.render(uwScene, nightCam);
  }
  if (night) renderer.render(nightScene, nightCam);
  renderer.autoClear = true;
  frames++;
  const now = performance.now();
  if (now - lastStat > 500) {
    stats = `· ${(frames * 1000 / (now - lastStat)).toFixed(0)} fps · ` +
      `${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} tris`;
    frames = 0; lastStat = now;
    updateLabel();
  }
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__scene = scene; window.__THREE = THREE; window.__camera = camera;   // debug hooks for the headless harness
window.__simStep = () => { simTick++; wanderStep(simTick * TICK); };
window.__dbg = { mountables, keys, findInteraction, herd, talkers, callers, doors, carts, collides, colliderSites, goods, hands, get barge() { return bargeSt; }, get boat() { return boatSt; }, sites, groundH, bargePose, yards, callNow: () => { for (const c of callers) c.next = 0; }, speech: () => ({ spoken, langMode, toneMode, wordMode, moodMode }),
  talkNow: () => { for (const t of talkers) t.next = 0; },
  look: (x, z) => { yaw = Math.atan2(-(x - camera.position.x), -(z - camera.position.z)); },
  place: (x, z) => { camera.position.x = x; camera.position.z = z; standY = terrainY(x, z); airborne = false; },
  state: () => ({ mounted: mounted?.def.name ?? null, flying: !!mounted?.flying, standY, y: mounted?.w.p.y,
                  wingT: mounted?.wingT, animT: mounted?.animT }) };
window.__ready = true;
</script>
</body>
</html>
